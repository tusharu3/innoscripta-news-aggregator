# Shared rules for every /api/<source>/ location (included per location, because nginx drops
# inherited proxy_set_header / add_header directives in any block that declares its own).
include /etc/nginx/snippets/security-headers.conf;

# Read-only proxy: provider APIs are only ever queried, so anything but GET (and HEAD) is refused.
limit_except GET { deny all; }

# Per-IP rate limit (zone defined in default.conf): our keys must not become a free relay.
limit_req zone=api_per_ip burst=20 nodelay;
limit_req_status 429;

# Never forward visitor cookies or credentials to third-party APIs.
proxy_set_header Cookie "";
proxy_set_header Authorization "";
