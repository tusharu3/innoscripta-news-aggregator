# Security headers, included in every `location` block of nginx.conf.template.
# (nginx drops server-level add_header directives in any location that declares its own,
#  so including this snippet per location is the reliable way to apply them everywhere.)

# Content Security Policy: only our own scripts, styles, fonts and API calls.
# Images may come from any https news CDN (article thumbnails), plus data: for inline SVG icons.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS belongs on the TLS-terminating proxy/CDN in front of this container (it serves plain HTTP).
